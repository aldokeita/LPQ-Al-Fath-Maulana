  <circle cx="80" cy="80" r="56" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".46" stroke-width="2"/>
  <text x="80" y="76" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">LPQ</text>
  <text x="80" y="105" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2">AFM</text>
  <text x="80" y="132" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1">PLACEHOLDER</text>
