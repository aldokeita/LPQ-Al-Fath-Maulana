<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder logo LPQ Al-Fath Maulana</title>
  <desc id="desc">Placeholder berinisial AFM; ganti dengan logo resmi setelah tersedia.</desc>
  <defs>
    <linearGradient id="aurora" x1="22" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset=".48" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#7c3aed"/>
