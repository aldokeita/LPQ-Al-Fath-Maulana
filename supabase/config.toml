# Local Supabase configuration for LPQ Al-Fath Maulana.
# Local-only configuration. Do not put staging or production secrets in this file.

project_id = "lpq-al-fath-maulana-local"

[api]
enabled = true
port = 55321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[analytics]
enabled = true
port = 55327
backend = "postgres"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "25MiB"

[functions.signin-with-nomor-induk]
verify_jwt = false

[functions.manage-user]
verify_jwt = true

[functions.reset-user-password]
verify_jwt = true

[functions.generate-signed-upload-url]
verify_jwt = true

[functions.record-login-attempt]
verify_jwt = false
